[project]
name = "pymadden"
version = "0.1.0"
description = "A Python library for accessing the EA Ratings API."
readme = "README.md"
authors = [
    {name = "Timothy Byrne", email = "trbyrne.11@gmail.com"},
]
requires-python = ">=3.8,<4.0"
dependencies = [
    "pydantic>=1.9.0,<2.0.0",
    "aiohttp>=3.9.5,<4.0.0",
    "aiodns>=3.2.0,<4.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.3.5,<1.0.0",
    "isort>=5.10.1,<6.0.0",
    "flake8>=4.0.1,<5.0.0",
    "black>=22.3.0,<23.0.0",
    "pytest>=7.1.2,<8.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-asyncio>=0.18.3,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | build
  | dist
)/
'''

[tool.pytest]
minversion = "6.0"
addopts = "--verbose"
testpaths = ["tests",]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
lint.select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]

lint.ignore = [
    "E501",  # line too long
    # Add any other rules you want to ignore
]

exclude = [
    ".venv",
    ".git",
    "*.md",
    # Add any other files or directories to exclude
]


