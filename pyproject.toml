[project]
name = "pymadden"
version = "0.2.0"
description = "Async Python client for the EA Madden NFL ratings APIs (Madden 22-25)."
readme = "README.md"
authors = [
    {name = "Timothy Byrne", email = "trbyrne.11@gmail.com"},
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]
keywords = ["madden", "nfl", "ea", "ratings", "api", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
pymadden = "pymadden.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.3.5,<1.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--verbose"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
exclude = [".venv", ".git"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]
ignore = [
    "E501",  # line too long
]
